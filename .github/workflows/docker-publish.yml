name: Test, build, and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Real CI gate: everything below this step only runs if the tests pass. A step failure
      # stops the whole job automatically, so a broken push to main never reaches Docker Hub.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagging with the commit SHA (in addition to :latest) means a bad deploy can be rolled
          # back fast in Portainer -- just point the stack at the previous sha-<...> tag -- instead
          # of needing to rebuild from an older commit.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adoptscout:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/adoptscout:sha-${{ github.sha }}
