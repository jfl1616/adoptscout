name: Build and publish Docker image

# Builds the Dockerfile in this repo and pushes it to Docker Hub as
# <DOCKERHUB_USERNAME>/adoptscout:latest whenever main changes -- no local
# Docker install needed on any dev machine. Requires two repo secrets to be
# set first (Settings -> Secrets and variables -> Actions -> New repository
# secret): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token, not your
# Docker Hub password -- create one at hub.docker.com under
# Account Settings -> Security -> New Access Token).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/adoptscout:latest
